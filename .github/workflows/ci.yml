name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # These gates are also enforced inside `next build` (next.config.mjs has
      # ignoreDuringBuilds/ignoreBuildErrors set to false), but running them
      # separately gives a readable failure instead of a build log to dig through.
      - name: ESLint
        run: npx eslint .

      - name: TypeScript
        run: npx tsc --noEmit
