name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: portfolio

jobs:
  build:
    name: Build & push to ECR
    runs-on: ubuntu-latest
    # Dormant until the infrastructure exists. `vars` (unlike `secrets`) is
    # readable in a job-level condition.
    if: vars.NEXT_PUBLIC_SITE_URL != ''
    permissions:
      contents: read
      id-token: write # required to mint the OIDC token AWS trades for a role
    steps:
      - uses: actions/checkout@v4

      # No long-lived AWS keys anywhere: GitHub mints a short-lived OIDC token,
      # AWS exchanges it for temporary credentials scoped to this repo+branch.
      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The account id appears in the ECR registry hostname, which is derived at
      # runtime and therefore not masked by GitHub automatically. Register it so
      # it is redacted from this public repository's logs.
      - name: Mask account id
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Compute image reference
        id: meta
        run: |
          echo "image=${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Compose files are staged in S3 rather than scp'd: there is no SSH path
      # to this instance at all.
      - name: Stage deploy files
        run: aws s3 sync deploy/ "s3://${{ secrets.DEPLOY_BUCKET }}/deploy/" --delete --exclude '.env.example'

  deploy:
    name: Release to EC2
    needs: build
    runs-on: ubuntu-latest
    environment: production
    if: vars.NEXT_PUBLIC_SITE_URL != ''
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Reconstructed here rather than passed from the build job: the ref embeds
      # the masked account id, and masked values arrive empty as job outputs.
      - name: Resolve image reference
        id: img
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::$account"
          echo "image=${account}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # Driven through SSM, so the security group never opens port 22 and there
      # are no SSH keys stored in GitHub.
      - name: Release via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          BUCKET: ${{ secrets.DEPLOY_BUCKET }}
          IMAGE: ${{ steps.img.outputs.image }}
        run: |
          set -euo pipefail
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters commands="[\"set -euo pipefail\",\"aws s3 sync s3://${BUCKET}/deploy/ /opt/portfolio/ --delete --exclude .env\",\"chmod +x /opt/portfolio/release.sh\",\"/opt/portfolio/release.sh '${IMAGE}' '${GITHUB_SHA}'\"]" \
            --query 'Command.CommandId' --output text)"
          echo "ssm command: $command_id"

          aws ssm wait command-executed \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text

          status="$(aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query 'Status' --output text)"

          if [ "$status" != "Success" ]; then
            echo "--- stderr ---" >&2
            aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query 'StandardErrorContent' --output text >&2
            echo "release failed with SSM status: $status" >&2
            exit 1
          fi

      - name: Verify public endpoint
        env:
          SITE: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          for i in $(seq 1 10); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$SITE/healthz" || true)"
            if [ "$code" = "200" ]; then echo "public /healthz ok"; exit 0; fi
            echo "attempt $i: got $code, retrying"; sleep 5
          done
          echo "public /healthz never returned 200" >&2
          exit 1
